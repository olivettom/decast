<meta charset="UTF-8">

<title>La DecAst - Stuffs TESO</title>
<style>
:root{--bg:#0f1015;--card:#181a24;--gold:#d4af37;--gold2:#f3e5ab;--txt:#e2e8f0;--mut:#94a3b8;--bd:rgba(212,175,55,.3);--red:#f87171}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:14px;max-width:900px;margin-inline:auto;-webkit-text-size-adjust:100%}
header{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:14px}
h1{color:var(--gold);margin:0 0 4px;font-size:1.5rem;letter-spacing:2px}
.sub{color:var(--mut);font-size:.85rem}
.ver{display:inline-block;margin-top:6px;font-size:.75rem;color:var(--gold2);border:1px solid var(--bd);border-radius:20px;padding:2px 10px}
#install{display:none;width:100%;background:linear-gradient(135deg,#d4af37,#aa820a);color:#000;font-weight:700;border:0;padding:12px;border-radius:8px;margin-bottom:12px;font-size:1rem;cursor:pointer}
#q{width:100%;padding:13px;background:var(--card);border:1px solid var(--bd);color:#fff;font-size:1rem;border-radius:8px;margin-bottom:10px}
#q:focus{outline:2px solid var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--bd);color:var(--txt);padding:8px 12px;border-radius:20px;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold)}
#count{color:var(--mut);font-size:.8rem;margin:0 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.hd h3{margin:0;color:var(--gold2);font-size:1.05rem;flex:1}
.tag{font-size:.72rem;padding:2px 8px;border-radius:4px;background:rgba(212,175,55,.15);color:var(--gold);white-space:nowrap}
.tag.Tank{color:#7dd3fc;background:rgba(125,211,252,.12)}.tag.Heal{color:#86efac;background:rgba(134,239,172,.12)}
.tag.DD{color:#fca5a5;background:rgba(252,165,165,.12)}.tag.Support{color:#c4b5fd;background:rgba(196,181,253,.12)}
.arr{color:var(--gold);transition:transform .15s}
.card.open .arr{transform:rotate(90deg)}
.bd{display:none;padding:0 14px 14px}
.card.open .bd{display:block}
.bd h4{color:var(--gold);margin:14px 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:1px}
ul{margin:4px 0 0 18px;padding:0}li{font-size:.92rem;margin-bottom:5px;line-height:1.35}
.farm li{list-style:none;margin-left:-18px}
.farm .n{display:inline-block;min-width:1.6em;color:var(--gold);font-weight:700}
.prio{color:var(--red);font-weight:700}
.row{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.88rem}
.row .p{color:var(--mut)}.row .s{color:var(--gold2);font-weight:600}.row .s.none{color:var(--mut);font-weight:400}
.row .d{grid-column:2;color:var(--mut);font-size:.8rem}
.lk a{color:var(--gold);margin-right:14px;font-size:.9rem}
.todo{border:1px dashed var(--bd);border-radius:6px;padding:8px 10px;color:var(--mut);font-size:.85rem;margin-top:10px}
.copy{margin-top:14px;background:transparent;color:var(--gold);border:1px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:.9rem;cursor:pointer;width:100%}
.copy.ok{background:var(--gold);color:#000}
.none-found{text-align:center;color:var(--mut);padding:30px 0}
.zone{color:var(--mut);font-size:.88rem;margin:10px 0 2px}
.sets li{list-style:none;margin-left:-18px;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)}
.sets li:first-child{border-top:0}
.sets .m{display:inline-block;min-width:1.6em}
.sets .en{color:var(--mut);font-size:.8rem}
.sets .who{color:var(--gold);font-size:.8rem}
footer{text-align:center;color:var(--mut);font-size:.72rem;margin:20px 0 6px}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'").replace(/œ/g,"oe")}
var ROLE_LBL={Tank:"🛡️ Tank",Heal:"💚 Heal",DD:"⚔️ DD",Support:"✨ Support"};
var ROLE_ALIAS={Tank:"tank",Heal:"heal healer soigneur",DD:"dd dps degats",Support:"support supp zenkosh"};

C.forEach(function(d,i){
  d.id="c"+i;
  d.rows=d.b.map(function(r){var p=r.split("|");return {piece:p[0],traits:p[1],poids:p[2],ench:p[3],set:p[4]||""}});
  d.blob=norm([d.title,d.cls,d.role,ROLE_ALIAS[d.role],d.game.join(" "),d.ult.join(" "),d.rows.map(function(r){return [r.piece,r.traits,r.poids,r.ench,r.set].join(" ")}).join(" ")].join(" "));
});
FARM.forEach(function(f,i){
  f.id="f"+i;
  f.blob=norm(["farm priorite priorites stuffs a farmer",f.role,ROLE_ALIAS[f.role],f.remarks.join(" "),f.farm.join(" ")].join(" "));
});

function buildRow(r){
  var det=[r.traits,r.poids&&r.poids!=="/"?r.poids:"",r.ench].filter(Boolean).join(" · ");
  return '<div class="row"><div class="p">'+esc(r.piece)+'</div><div class="s'+(r.set?'':' none')+'">'+(r.set?esc(r.set):'—')+'</div><div class="d">'+esc(det)+'</div></div>';
}
function cardClass(d){
  var h='<div class="card" id="'+d.id+'" data-k="c"><div class="hd"><h3>'+esc(d.title)+'</h3><span class="tag '+d.role+'">'+ROLE_LBL[d.role]+'</span><span class="arr">▶</span></div><div class="bd">';
  h+='<h4>Gameplay</h4><ul>'+d.game.map(function(g){return '<li>'+esc(g)+'</li>'}).join('')+'</ul>';
  h+='<h4>Ultimes</h4><ul>'+d.ult.map(function(u){return '<li>'+esc(u)+'</li>'}).join('')+'</ul>';
  var lk='';
  if(d.m1)lk+='<a href="'+ML+d.m1+'" target="_blank" rel="noopener">Maîtrise 1 ↗</a>';
  if(d.m2)lk+='<a href="'+ML+d.m2+'" target="_blank" rel="noopener">Maîtrise 2 ↗</a>';
  if(lk)h+='<h4>Maîtrises de classe</h4><div class="lk">'+lk+'</div>';
  h+='<h4>Build</h4>'+d.rows.map(buildRow).join('');
  if(d.todo)h+='<div class="todo">⚠️ '+esc(d.todo)+'</div>';
  h+='<button class="copy" data-copy="'+d.id+'">📋 Copier pour Discord</button></div></div>';
  return h;
}
function cardFarm(f){
  var h='<div class="card farm" id="'+f.id+'" data-k="f"><div class="hd"><h3>⭐ Stuffs à farmer · '+esc(f.role)+'</h3><span class="tag '+f.role+'">'+ROLE_LBL[f.role]+'</span><span class="arr">▶</span></div><div class="bd">';

function cardInfo(){

  }).join('')+'</ul>';
  h+='<button class="copy" data-copy="'+t.id+'">📋 Copier pour Discord</button></div></div>';
  return h;

function mdTrial(t){
  return "**"+t.n+"** (`"+t.c+"`) · "+t.z+"\n"+t.s.map(function(s){return "• "+(s[2]?s[2]+" ":"")+s[0]+(s[3]?" ("+s[3]+")":"")}).join("\n");
}

function mdClass(d){
  var t="**"+d.title+"** ("+ROLE_LBL[d.role].replace(/^\S+\s/,"")+") · U52\n";
  t+=d.game.map(function(g){return "• "+g}).join("\n")+"\n";
  t+="**Ultimes :** "+d.ult.join(" / ")+"\n**Build :**\n";
  t+=d.rows.map(function(r){return "`"+r.piece+"` "+(r.set?"**"+r.set+"**":"—")+" ("+[r.traits,r.poids&&r.poids!=="/"?r.poids:"",r.ench].filter(Boolean).join(", ")+")"}).join("\n");
  return t;
}
function mdFarm(f){
  return "**⭐ Stuffs à farmer · "+f.role+"** (U52, par ordre de priorité)\n"+f.farm.map(function(g,i){return (i+1)+". "+g}).join("\n");
}
function copyText(t,btn){
  var done=function(){var o=btn.textContent;btn.textContent="✅ Copié !";btn.classList.add("ok");setTimeout(function(){btn.textContent=o;btn.classList.remove("ok")},1600)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,function(){fb()})}else fb();
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);done()}
}

var state={role:"all",q:""};
var CHIPS=[["all","Tous"],["Tank","🛡️ Tank"],["Heal","💚 Heal"],["DD","⚔️ DD"],["Support","✨ Support"],["trials","🏛️ Épreuves"],["farm","⭐ Farm prio"]];
var chipsEl=document.getElementById("chips");
chipsEl.innerHTML=CHIPS.map(function(c){return '<button class="chip'+(c[0]==="all"?' on':'')+'" data-r="'+c[0]+'">'+c[1]+'</button>'}).join("");
var listEl=document.getElementById("list"),countEl=document.getElementById("count");
var ALL=C.map(function(d){return {k:"c",o:d,html:cardClass(d)}}).concat(FARM.map(function(f){return {k:"f",o:f,html:cardFarm(f)}}));
TRIALS.forEach(function(t){ALL.push({k:"t",o:t,html:cardTrial(t)})});
ALL.push({k:"i",o:{blob:infoBlob,role:"all"},html:cardInfo()});

function render(){
  var terms=norm(state.q).split(/\s+/).filter(Boolean);
  var out=[],n=0;
  ALL.forEach(function(it){
    var ok=true;
    if(state.role==="farm")ok=it.k==="f";
    else if(state.role==="trials")ok=it.k==="t";
    else if(state.role!=="all"){ok=(it.k==="c"||it.k==="f")&&it.o.role===state.role;}
    if(ok&&it.k==="i")ok=state.role==="all";
    if(ok&&terms.length){ok=terms.every(function(t){return it.o.blob.indexOf(t)>-1})}
    if(ok){out.push(it.html);if(it.k!=="i")n++}
  });
  listEl.innerHTML=out.length?out.join(""):'<div class="none-found">Aucun résultat. Essaie un set, une classe ou un rôle.</div>';
  countEl.textContent=terms.length||state.role!=="all"?n+" fiche"+(n>1?"s":"")+" trouvée"+(n>1?"s":""):"";
  if(terms.length&&out.length<=3){[].forEach.call(listEl.querySelectorAll(".card"),function(c){c.classList.add("open")})}
}
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value;render()});
chipsEl.addEventListener("click",function(e){
  var b=e.target.closest(".chip");if(!b)return;
  state.role=b.dataset.r;
  [].forEach.call(chipsEl.children,function(c){c.classList.toggle("on",c===b)});render();
});
listEl.addEventListener("click",function(e){
  var cp=e.target.closest(".copy");
  if(cp){var id=cp.dataset.copy,txt="";
    var d=C.filter(function(x){return x.id===id})[0];
    if(d)txt=mdClass(d);else{var f=FARM.filter(function(x){return x.id===id})[0];if(f)txt=mdFarm(f);else{var tr=TRIALS.filter(function(x){return x.id===id})[0];if(tr)txt=mdTrial(tr)}}
    copyText(txt,cp);return;}
  var h=e.target.closest(".hd");if(h)h.parentNode.classList.toggle("open");
});
render();
